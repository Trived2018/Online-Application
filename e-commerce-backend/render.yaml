services:
  - type: web
    name: ecommerce-backend
    runtime: docker
    region: oregon
    plan: standard
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
