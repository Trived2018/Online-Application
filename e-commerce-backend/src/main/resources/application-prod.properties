server.port=${PORT:8081}
# Removed context path - handled per-route instead

# Render PostgreSQL Configuration with timezone fix
# DATABASE_URL format: postgresql://username:password@host:port/database
spring.datasource.url=${DATABASE_URL}?serverTimezone=UTC&useSSL=false
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.auto-commit=true

# Connection Pool Tuning for Render (smaller footprint)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-init-sql=SET timezone TO 'UTC'

# JPA/Hibernate - Production Safe Mode
# Using 'update' to preserve data across application restarts
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Server Configuration
server.compression.enabled=true
server.compression.min-response-size=1024
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Actuator for health checks (optional)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# Application Configuration
spring.main.allow-circular-references=true
spring.application.name=ecommerce-api

# Actuator Configuration - Enable health endpoints
management.endpoints.web.exposure.include=health,db
management.endpoint.health.show-details=always
management.health.db.enabled=true

# Logging - Minimal for production
logging.level.root=WARN
logging.level.com.youtube=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Twilio Configuration
twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}
twilio.verify.service.sid=${TWILIO_VERIFY_SERVICE_SID}
